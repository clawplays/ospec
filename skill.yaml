name: ospec
title: OSpec
description: Document-driven OSpec workflow skill for AI-assisted development with Codex, Claude Code, and similar AI tools.
author: OSpec Team
license: MIT

# This is the single source of truth for the OSpec skill interface.
# agents/openai.yaml points here instead of duplicating it.
interface:
  display_name: "OSpec"
  short_description: "Inspect, initialize, and operate OSpec projects"
  default_prompt: "Use $ospec to initialize this directory according to OSpec rules: use ospec init so the repository ends in change-ready state, reuse existing project docs when available, map an explicit language request or the current conversation language to --document-language during AI-assisted init instead of assuming a brand-new repo will infer it, ask one concise follow-up for missing summary or tech stack in AI-assisted flows, fall back to placeholder docs when the user skips that context, do not assume a web template when the project type is unclear, do not create the first change automatically, and use ospec status or ospec changes status only when you need an explicit summary."

requires_local:
  node: ">=18.0.0"
  npm: ">=8.0.0"

# The CLI catalogue is intentionally not carried here. Run `ospec help` or
# `ospec help <subcommand>` for the current command surface, and read SKILL.md
# for routing and for-ai/change-protocol.md for staged read order.
protocol:
  project_files:
    - ".skillrc"
    - "SKILL.md"
    - "SKILL.index.json"
    - ".ospec/tools/build-index-auto.cjs"
    - "for-ai/ai-guide.md"
    - "for-ai/change-protocol.md"
    - "for-ai/execution-protocol.md"
    - "for-ai/naming-conventions.md"
    - "for-ai/skill-conventions.md"
    - "for-ai/workflow-conventions.md"
    - "for-ai/development-guide.md"
  feature_files:
    - "changes/active/<feature>/proposal.md"
    - "changes/active/<feature>/tasks.md"
    - "changes/active/<feature>/state.json"
    - "changes/active/<feature>/verification.md"
    - "changes/active/<feature>/review.md"
  feature_name_format: "kebab-case"

guardrails:
  - "Treat init as change-ready initialization, not protocol-shell-only initialization."
  - "If the user intent is simply to initialize the project or current directory, still trigger the mandatory init flow without asking for a longer prompt."
  - "When the user asks to initialize, use ospec init to take the repository to change-ready state and verify the managed protocol-shell files plus docs/project/* on disk before declaring success."
  - "In AI-assisted flows, ask at most one concise follow-up for missing summary or tech stack before init when that context is unavailable."
  - "If the user declines or no AI follow-up is possible, continue with placeholder docs instead of blocking init."
  - "Do not assume the project is a web or Next.js project unless the repository or user makes that explicit."
  - "Do not apply business scaffold during plain init."
  - "Do not generate docs/project/bootstrap-summary.md during plain init or docs generate."
  - "Do not create the first change automatically unless the user explicitly asks for a change."
  - "Treat presets as planning defaults, not as init-time templates; scaffold still requires explicit intent."
  - "Read change files by stage: proposal/tasks/state are always in scope, verification.md when entering verification, review.md when entering review. Never front-load the whole change directory."
  - "Never read SKILL.index.json wholesale; use ospec index query <keyword...> to locate documents."
