name: ospec-goal

title: OSpec Goal

description: Create or advance a full OSpec goal using the current document, task graph, worker, review, and evidence workflow.

author: OSpec Team

license: MIT

interface:

  display_name: "OSpec Goal"

  short_description: "Full goal workflow"

  default_prompt: "Use $ospec-goal to run the fast quality workflow: create work with ospec goal <goal-name> [path] and explicit controller capability flags, run deterministic preflights and one combined planning review, then dispatch every Loop action through spawn_agent + bounded waits, persist evidence, and keep ticking until done or genuinely blocked."
