name: ospec-goal

title: OSpec Goal

description: Create or advance a full OSpec goal using the current document, task graph, worker, review, and evidence workflow.

author: OSpec Team

license: MIT

interface:

  display_name: "OSpec Goal"

  short_description: "Full goal workflow"

  default_prompt: "Use $ospec-goal for complex OSpec work that needs the full workflow. Inspect project state first, read .skillrc and managed for-ai guidance, announce which skill, command, and subagents you use as you go (Announce-Before-Act) and brainstorm open direction, architecture, API, UI, risk, and scope with the user one question at a time before locking design (Brainstorm-First), then create new work with ospec goal <goal-name> [path]. Keep proposal.md, design.md, implementation-plan.md, artifacts/agents/task-graph.json, tasks.md, document reviews, final reviews, worker-status.md, evidence artifacts, state.json, verification.md, and review.md aligned. Require approved design-review.md and implementation-plan-review.md before closeout. Require latest passing artifacts/agents/verification-evidence.json before archive/finalize. Use ospec-change for small routine changes."
