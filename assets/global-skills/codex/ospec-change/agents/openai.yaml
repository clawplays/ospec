interface:

  display_name: "OSpec Change"

  short_description: "Fast classic change workflow"

  default_prompt: "Use $ospec-change for an OSpec change selected by the user. Read the compact managed change-protocol.md and stage-relevant change files, announce commands before acting, keep the work on the classic profile without auto-promoting it to Goal, put batch changes in the queue, and maintain proposal.md, tasks.md, state.json, verification.md, and review.md. The current AI performs the lightweight review. Bug fixes may justify no documentation impact; features require real documentation beyond a legacy generated archive summary. Verify and automatically finalize when every closeout gate is ready."
